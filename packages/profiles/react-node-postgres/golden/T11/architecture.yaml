  - { id: feat.search, kind: react.feature, name: Search, parent: layer.features, layer: presentation, code: [ src/** ] }
  - { id: feat.storefront, kind: react.feature, name: Storefront, parent: layer.widgets, layer: presentation, code: [ src/** ] }
